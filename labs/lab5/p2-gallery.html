<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="p2-gallery.css" />
  </head>
  <body>
    <h1>Photo Gallery</h1>

    <!-- Hero image: replace the src with your own file in images/ -->
    <img class="hero" src="images/hero.jpg" alt="Hero image" />

    <div class="gallery">
      <figure class="tile">
        <img src="images/tile-1.jpg" alt="Describe this image" />
        <figcaption>Caption 1</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/tile-2.jpg" alt="Describe this image" />
        <figcaption>Caption 2</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/tile-3.jpg" alt="Describe this image" />
        <figcaption>Caption 3</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/tile-4.jpg" alt="Describe this image" />
        <figcaption>Caption 4</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/tile-5.jpg" alt="Describe this image" />
        <figcaption>Caption 5</figcaption>
      </figure>
      <!-- TODO 2: this tile is deliberately a tall portrait photo.
           Under object-fit: cover it will crop badly.
           Fix the framing with object-position in your CSS. -->
      <figure class="tile tile-portrait">
        <img src="images/tile-6.jpg" alt="Describe this image" />
        <figcaption>Caption 6</figcaption>
      </figure>
    </div>
  </body>
</html>
