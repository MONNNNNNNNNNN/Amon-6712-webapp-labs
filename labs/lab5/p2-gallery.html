<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="styles/p2-gallery.css" />
  </head>
  <body>
    <h1>Photo Gallery</h1>

    <!-- Hero image: replace the src with your own file in images/ -->
    <img class="hero" src="images/Cat0.png" alt="Hero image" />

    <div class="gallery">
      <figure class="tile">
        <img src="images/Cat1.png" alt="Describe this image" />
        <figcaption>Fat cat</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/Cat2.png" alt="Describe this image" />
        <figcaption>Black cat</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/Cat3.png" alt="Describe this image" />
        <figcaption>Prisma cat</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/Cat4.png" alt="Describe this image" />
        <figcaption>Cartoon cat</figcaption>
      </figure>
      <figure class="tile">
        <img src="images/Cat5.png" alt="Describe this image" />
        <figcaption>Robot cat</figcaption>
      </figure>
      <!-- TODO 2: this tile is deliberately a tall portrait photo.
           Under object-fit: cover it will crop badly.
           Fix the framing with object-position in your CSS. -->
      <figure class="tile tile-portrait">
        <img src="images/Cat8.png" alt="Describe this image" />
        <figcaption>High cat</figcaption>
      </figure>
    </div>
  </body>
</html>
